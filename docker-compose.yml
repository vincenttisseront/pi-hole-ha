# Cluster Pi-hole HA derrière Traefik + DNS sur l'hôte Docker.
#
# - pihole-1 / pihole-2 : IP attribuées par Docker (aucun NODE*_IP / VIP dans .env)
# - dnsdist : écoute :53 sur l'hôte et bascule vers un backend sain
# - nebula-sync : listes / groupes / clients du primaire → réplica
# - Traefik : UI admin du primaire (même réseau Docker)
#
# COMPOSE_PROFILES :
#   bundle  les deux nœuds + dnsdist + sync (un hôte)
#   node1   primaire (+ sync) sans dnsdist
#   node2   réplica seul

name: pihole-cluster

x-pihole: &pihole
  image: pihole/pihole:latest
  cap_add:
    - SYS_NICE
    - SYS_TIME
  dns:
    - ${UPSTREAM_1}
    - ${UPSTREAM_2}
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD-SHELL", "dig +time=2 +tries=1 +retry=0 @127.0.0.1 pi.hole A >/dev/null 2>&1 || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 120s

x-pihole-env: &pihole-env
  TZ: ${TZ}
  FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
  FTLCONF_dns_listeningMode: "ALL"
  FTLCONF_dns_upstreams: "${UPSTREAM_1};${UPSTREAM_2}"
  FTLCONF_dns_dnssec: "${DNSSEC:-false}"
  FTLCONF_dhcp_active: "false"
  FTLCONF_webserver_api_app_sudo: "true"
  FTLCONF_webserver_domain: "${TRAEFIK_HOST:-pi.hole}"
  FTLCONF_webserver_port: "${TRAEFIK_SERVICE_PORT:-80}"

x-traefik-labels-primary: &traefik-labels-primary
  - "traefik.enable=${TRAEFIK_ENABLE:-false}"
  - "traefik.docker.network=${DOCKER_NETWORK}"
  - "traefik.http.routers.pihole.rule=Host(`${TRAEFIK_HOST:-pihole.example.com}`)"
  - "traefik.http.routers.pihole.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
  - "traefik.http.routers.pihole.tls=${TRAEFIK_TLS:-true}"
  - "traefik.http.routers.pihole.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
  - "traefik.http.routers.pihole.service=pihole"
  - "traefik.http.services.pihole.loadbalancer.server.port=${TRAEFIK_SERVICE_PORT:-80}"
  - "traefik.http.services.pihole.loadbalancer.passHostHeader=true"
  - "traefik.http.routers.pihole-root.rule=Host(`${TRAEFIK_HOST:-pihole.example.com}`) && Path(`/`)"
  - "traefik.http.routers.pihole-root.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
  - "traefik.http.routers.pihole-root.tls=${TRAEFIK_TLS:-true}"
  - "traefik.http.routers.pihole-root.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
  - "traefik.http.routers.pihole-root.middlewares=pihole-to-admin"
  - "traefik.http.middlewares.pihole-to-admin.redirectregex.regex=.*"
  - "traefik.http.middlewares.pihole-to-admin.redirectregex.replacement=/admin/"
  - "traefik.http.middlewares.pihole-to-admin.redirectregex.permanent=true"

services:
  pihole-1:
    <<: *pihole
    profiles: ["bundle", "node1"]
    container_name: pihole-1
    hostname: pihole-1
    environment:
      <<: *pihole-env
    volumes:
      - ./data/pihole-1:/etc/pihole
    networks:
      proxy: {}
    labels: *traefik-labels-primary

  pihole-2:
    <<: *pihole
    profiles: ["bundle", "node2"]
    container_name: pihole-2
    hostname: pihole-2
    environment:
      <<: *pihole-env
    volumes:
      - ./data/pihole-2:/etc/pihole
    networks:
      proxy: {}
    labels:
      - "traefik.enable=${TRAEFIK_REPLICA_ENABLE:-false}"
      - "traefik.docker.network=${DOCKER_NETWORK}"
      - "traefik.http.routers.pihole-replica.rule=Host(`${TRAEFIK_HOST_REPLICA:-pihole-replica.example.com}`)"
      - "traefik.http.routers.pihole-replica.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.pihole-replica.tls=${TRAEFIK_TLS:-true}"
      - "traefik.http.routers.pihole-replica.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.pihole-replica.service=pihole-replica"
      - "traefik.http.services.pihole-replica.loadbalancer.server.port=${TRAEFIK_SERVICE_PORT:-80}"
      - "traefik.http.services.pihole-replica.loadbalancer.passHostHeader=true"

  # DNS des clients = IP de cet hôte Docker (pas une VIP dans .env).
  dnsdist:
    image: pihole-cluster-dnsdist:local
    build: ./dnsdist
    profiles: ["bundle"]
    container_name: dnsdist
    depends_on:
      pihole-1:
        condition: service_healthy
      pihole-2:
        condition: service_healthy
    ports:
      - "${DNS_HOST_IP:-0.0.0.0}:53:53/tcp"
      - "${DNS_HOST_IP:-0.0.0.0}:53:53/udp"
    networks:
      proxy: {}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    profiles: ["bundle", "node1"]
    container_name: nebula-sync
    depends_on:
      pihole-1:
        condition: service_healthy
      pihole-2:
        condition: service_healthy
        required: false
    environment:
      TZ: ${TZ}
      PRIMARY: "http://pihole-1|${PIHOLE_PASSWORD}"
      REPLICAS: "http://${REPLICA_HOST:-pihole-2}|${PIHOLE_PASSWORD}"
      FULL_SYNC: "false"
      RUN_GRAVITY: "${RUN_GRAVITY:-true}"
      SYNC_GRAVITY_GROUP: "true"
      SYNC_GRAVITY_AD_LIST: "true"
      SYNC_GRAVITY_AD_LIST_BY_GROUP: "true"
      SYNC_GRAVITY_DOMAIN_LIST: "true"
      SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP: "true"
      SYNC_GRAVITY_CLIENT: "true"
      SYNC_GRAVITY_CLIENT_BY_GROUP: "true"
      CRON: "${SYNC_CRON}"
      CLIENT_RETRY_DELAY_SECONDS: "10"
      CLIENT_TIMEOUT_SECONDS: "120"
    networks:
      proxy: {}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Même réseau que Traefik (ex. vpcbr). Docker y assigne les IP des conteneurs.
  proxy:
    name: ${DOCKER_NETWORK}
    external: ${DOCKER_NETWORK_EXTERNAL:-true}
